<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#005A9C">
  <title>UBS Rápida — sem conexão</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8f9fa; color: #17212b; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
    main { max-width: 34rem; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 16px 36px rgba(0, 57, 99, .12); }
    h1 { color: #005a9c; margin: 0 0 12px; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    p { font-size: 1.05rem; line-height: 1.6; }
    button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #005a9c; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #17212b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Conexão indisponível</h1>
    <p>A UBS Rápida precisa de internet para proteger e atualizar as informações. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
